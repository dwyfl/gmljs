packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

allowBuilds:
  canvas: true

catalog:
  "@changesets/cli": ^3.0.3
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.3
  "@types/node": ^22
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  jsdom: ^30.1.3
  react: ^19.2.0
  react-dom: ^19.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@asamuzakjp/dom-selector@10.0.3"
  - jsdom@30.1.3
  - mediabunny@1.61.5
