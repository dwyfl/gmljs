packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

allowBuilds:
  canvas: true
  skia-canvas: true

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
