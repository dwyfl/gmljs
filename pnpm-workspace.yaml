packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

allowBuilds:
  canvas: true

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@asamuzakjp/dom-selector@10.0.3"
  - jsdom@30.1.3
  - mediabunny@1.61.5
